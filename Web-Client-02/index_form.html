<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style_form.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Registration Form</header>
    <form action="index.html" target="_blank">
       <!--action is an attribute
       defimes the action to  be done when we prees the submit button.
       Usually , the form data sents package of data to the server and if all the data is good we the succes message --> 
        <fieldset>
            <legend>Webinar Registration</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname"><br><br>
            <label for="lname">Last Name</label>
            <input type="text" id="lname"><br><br>
            <label for="job">Select your job</label><br><br>
            <input type="checkbox" id="student" name="student">
            <label for="student">Student</label>
            <input type="checkbox" id="teacher" name="teacher">
            <label for="teacher">Teacher</label>
            <input type="checkbox" id="admin" name="admin">
            <label for="admin">Administration</label><br><br>
            <label for="time">Choose your time: &nbsp;&nbsp;</label>
            <select name="time" id="time">
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
            </select><br><br>
            <label for="comment">comment</label><br>
            <textarea name="message" id="message">Put your message here</textarea><br><br>
        </fieldset><br><br>
        <!--Button has many attributes-->
        <button type="button" onclick="alert('Thank you! Your information is submitted.')">Submit</button>
    </form>

</body>
</html>
