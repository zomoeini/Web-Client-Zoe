<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Bootstrap</title>
    <!-- Bootstrap is a framwork for CSS-->
     <!--for using Bootstrap I should add extra link , define different sources -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</head>
<body>
    <!--wrap all your content and elements in one or more containers -->
    <!-- div  division orgnize content and divide sections in html file -->
     <!--Container fixed width and it is for design our page more responsive to different screen -->
     <div class="container">
        <h1>Hello Bootstrap</h1>
        <p>I use .container class : provide a responsive fixed width container</p>
     </div>
     <div class="container-fluid">
        <h1>My First Bootstrap</h1>
        <p>I use .container-fluid class : provide a responsive not fixed width container</p>
     </div>
</body>
</html>
